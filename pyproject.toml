[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dskit"
version = "0.1.0"
description = "Data science toolkit for client and remote work: profile, validate, clean, baseline ML, forecast, A/B tests, RFM — each producing a client-ready HTML report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nuzul Nur Robbulizzat" }]
keywords = ["data science", "eda", "data quality", "automl", "forecasting", "ab testing", "rfm"]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
parquet = ["pyarrow>=15"]

[project.scripts]
dskit = "dskit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501", "E702", "E731", "B023", "B905", "E741", "UP007"]
